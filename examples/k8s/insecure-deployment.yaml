apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-web
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: insecure-web}
  template:
    metadata:
      labels: {app: insecure-web}
    spec:
      containers:
        - name: web
          image: nginx:1.25
          securityContext:
            privileged: true
          env:
            - name: DB_PASSWORD
              value: "hunter2"
            - name: LOG_LEVEL
              value: info
      volumes:
        - name: host-root
          hostPath:
            path: /
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: too-powerful
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]