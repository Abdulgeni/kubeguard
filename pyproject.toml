[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeguard"
version = "0.1.0"
description = "Security scanner for Docker images and Kubernetes manifests"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "docker>=7.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"